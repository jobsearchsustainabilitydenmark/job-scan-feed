name: Merge shortlist pending

on:
  push:
    paths:
      - 'data/shortlist/pending/*.json'
      - '.github/workflows/merge-shortlist.yml'

permissions:
  contents: write

jobs:
  merge:
    if: ${{ !contains(github.event.head_commit.message, 'Merge pending shortlist') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge pending shortlist jobs and generate CSV view
        run: |
          python - <<'PY'
          import csv, json, glob, os

          master_path='data/shortlist/job_shortlist_master.json'
          csv_path='data/shortlist/job_shortlist_master.csv'

          with open(master_path, encoding='utf-8') as f:
              master=json.load(f)
          jobs=master.get('jobs', [])

          def norm(s):
              return ' '.join((s or '').lower().split())

          def key(j):
              return (norm(j.get('title')), norm(j.get('company')), norm(j.get('location')))

          existing={key(j) for j in jobs}
          added=0
          pending=sorted(glob.glob('data/shortlist/pending/*.json'))
          for p in pending:
              with open(p, encoding='utf-8') as f:
                  payload=json.load(f)
              for j in payload.get('jobs', []):
                  k=key(j)
                  if k not in existing:
                      jobs.append(j)
                      existing.add(k)
                      added += 1

          rank={'A':0,'B':1,'C':2}
          jobs.sort(
              key=lambda j:(
                  j.get('shortlist_date') or j.get('posting_date') or '',
                  -rank.get((j.get('match') or '')[:1],3),
                  j.get('title') or ''
              ),
              reverse=True
          )

          master['jobs']=jobs
          with open(master_path,'w',encoding='utf-8') as f:
              json.dump(master,f,ensure_ascii=False,indent=2)
              f.write('\n')

          fields = [
              'shortlist_date', 'posting_date', 'match', 'title', 'company',
              'location', 'source', 'track', 'assessment', 'url', 'priority',
              'application_status', 'deadline', 'applied_date', 'result',
              'next_action'
          ]
          with open(csv_path,'w',encoding='utf-8-sig',newline='') as f:
              writer=csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
              writer.writeheader()
              for j in jobs:
                  writer.writerow({field: j.get(field, '') if j.get(field) is not None else '' for field in fields})

          for p in pending:
              os.remove(p)

          print(f'Added {added} jobs; total {len(jobs)}; CSV refreshed')
          PY
      - name: Commit merged master and CSV view
        run: |
          git config user.name 'job-scan-bot'
          git config user.email 'job-scan-bot@users.noreply.github.com'
          git add -A data/shortlist
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Merge pending shortlist jobs and refresh CSV'
            git push
          fi
